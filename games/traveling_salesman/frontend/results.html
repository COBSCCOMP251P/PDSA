<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSP Results</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind utilities -->
    <link rel="stylesheet" href="styles.css" /> <!-- Custom helpers -->
  </head>
  <body class="min-h-screen bg-blue-50 text-slate-900" data-page="results">
    <div class="max-w-6xl mx-auto px-4 py-8 space-y-8">
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <p class="text-sm uppercase tracking-widest text-sky-700">Results</p> <!-- Subtitle -->
          <h1 class="text-3xl font-bold">Your Performance</h1> <!-- Title -->
        </div>
        <div class="flex items-center gap-3">
          <button
            id="play-again"
            class="px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-semibold transition shadow-md"
          >
            Play Again
          </button> <!-- Play again -->
        </div>
      </header>

      <main class="space-y-6">
        <section class="grid md:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-3">
            <h2 class="text-xl font-semibold">Player Route</h2> <!-- Player route title -->
            <p id="player-route" class="text-sm text-slate-700"></p> <!-- Player route text -->
            <p id="player-distance" class="text-sm text-slate-700"></p> <!-- Player distance -->
            <p id="player-score" class="text-sm text-sky-700 font-semibold"></p> <!-- Player score -->
            <div id="loss-message" class="text-sm"></div> <!-- Loss message -->
          </div>
          <div class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-3">
            <h2 class="text-xl font-semibold">Algorithm Results (ms)</h2> <!-- Algorithms title -->
            <ul class="space-y-2 text-sm text-slate-700" id="algorithm-list"></ul> <!-- Algorithm list -->
          </div>
        </section>

        <section class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-4">
          <h2 class="text-xl font-semibold">Most Optimal</h2> <!-- Optimal title -->
          <p id="optimal-summary" class="text-sm text-slate-700"></p> <!-- Optimal summary -->
        </section>

        <section class="flex flex-wrap gap-3">
          <button
            id="play-next-round"
            class="px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-semibold transition shadow-md"
          >
            Play Next Round
          </button> <!-- Next round -->
          <button
            id="play-new-game"
            class="px-5 py-3 rounded-xl bg-white border border-blue-200 hover:border-sky-400 text-slate-700 transition"
          >
            Play New Game
          </button> <!-- New game -->
        </section>
      </main>
    </div>
    <div id="loader" class="hidden fixed inset-0 bg-blue-50/90 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="spinner"></div> <!-- Loading animation -->
    </div>
    <script src="script.js"></script> <!-- Page logic -->
  </body>
</html>
