<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSP Results</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind utilities -->
    <link rel="stylesheet" href="css/styles.css" /> <!-- Custom helpers -->
</head>

<body class="min-h-screen bg-blue-50 text-slate-900" data-page="results">
    <div class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <p class="text-sm uppercase tracking-widest text-sky-700">Results</p>
                <h1 class="text-3xl font-bold">Your Performance</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="play-again"
                    class="px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-semibold transition shadow-md">
                    Play Again
                </button>
            </div>
        </header>

        <main class="space-y-6">
            <!-- Player Stats -->
            <section class="grid md:grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-3">
                    <h2 class="text-xl font-semibold">Player Route</h2>
                    <p id="player-route" class="text-sm text-slate-700"></p>
                    <p id="player-distance" class="text-sm text-slate-700"></p>
                    <p id="player-score" class="text-sm text-sky-700 font-semibold"></p>
                    <div id="loss-message" class="text-sm"></div>
                </div>

                <!-- Algorithms Stats -->
                <div class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-3">
                    <h2 class="text-xl font-semibold">Algorithm Results (ms)</h2>
                    <ul class="space-y-2 text-sm text-slate-700" id="algorithm-list"></ul>
                </div>
            </section>

            <!-- Optimal Algorithm -->
            <section class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-4">
                <h2 class="text-xl font-semibold">Optimal Algorithm</h2>
                <p id="optimal-summary" class="text-sm text-slate-700"></p>
            </section>

            <!-- Fastest Algorithm -->
            <section class="bg-white rounded-2xl border border-blue-100 shadow-md p-6 space-y-4">
                <h2 class="text-xl font-semibold">Fastest Algorithm</h2>
                <p id="fastest-summary" class="text-sm text-slate-700"></p>
            </section>

            <!-- Action Buttons -->
            <section class="flex flex-wrap gap-3">
                <button id="play-next-round"
                    class="px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-semibold transition shadow-md">
                    Play Next Round
                </button>
                <button id="play-new-game"
                    class="px-5 py-3 rounded-xl bg-white border border-blue-200 hover:border-sky-400 text-slate-700 transition">
                    Play New Game
                </button>
            </section>
        </main>
    </div>

    <!-- Loader -->
    <div id="loader" class="hidden fixed inset-0 bg-blue-50/90 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="spinner"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
